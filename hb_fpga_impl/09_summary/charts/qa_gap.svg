<svg viewBox="0 0 560 285" role="img" aria-label="从账本估计到实测：0.27s 怎么变成 4.32s（单位：秒，250MHz 口径）" style="width:100%;height:auto;display:block"><line x1="32" y1="240" x2="528" y2="240" stroke="#e1e0d9" stroke-width="1"/><text x="26" y="244" text-anchor="end" font-size="11" fill="#898781">0</text><line x1="32" y1="198.33333333333331" x2="528" y2="198.33333333333331" stroke="#e1e0d9" stroke-width="1"/><text x="26" y="202.33333333333331" text-anchor="end" font-size="11" fill="#898781">1</text><line x1="32" y1="156.66666666666666" x2="528" y2="156.66666666666666" stroke="#e1e0d9" stroke-width="1"/><text x="26" y="160.66666666666666" text-anchor="end" font-size="11" fill="#898781">2</text><line x1="32" y1="115" x2="528" y2="115" stroke="#e1e0d9" stroke-width="1"/><text x="26" y="119" text-anchor="end" font-size="11" fill="#898781">3</text><line x1="32" y1="73.33333333333331" x2="528" y2="73.33333333333331" stroke="#e1e0d9" stroke-width="1"/><text x="26" y="77.33333333333331" text-anchor="end" font-size="11" fill="#898781">4</text><line x1="32" y1="240" x2="528" y2="240" stroke="#c3c2b7" stroke-width="1"/><path d="M62,240 L62,232.75 A4,4 0 0 1 66,228.75 L134,228.75 A4,4 0 0 1 138,232.75 L138,240 Z" fill="#2a78d6" data-tip="研究阶段账本：73.7 GMAC ÷ 273 GMAC/s = 0.27s。273 = 假设阵列 63% 时间在算"/><text x="100" y="220.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">0.27s</text><text x="100" y="258" text-anchor="middle" font-size="12" fill="#52514e">账本估计</text><text x="100" y="273" text-anchor="middle" font-size="12" fill="#52514e">(双视角)</text><path d="M182,240 L182,221.91666666666666 A4,4 0 0 1 186,217.91666666666666 L254,217.91666666666666 A4,4 0 0 1 258,221.91666666666666 L258,240 Z" fill="#2a78d6" data-tip="换成实测这次跑的工作量 145.8 GMAC（4 相机 vs 账本 2 视角），效率不动：0.53s"/><text x="220" y="209.91666666666666" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">0.53s</text><text x="220" y="258" text-anchor="middle" font-size="12" fill="#52514e">×1.98</text><text x="220" y="273" text-anchor="middle" font-size="12" fill="#52514e">工作量口径</text><path d="M302,240 L302,209.83333333333334 A4,4 0 0 1 306,205.83333333333334 L374,205.83333333333334 A4,4 0 0 1 378,209.83333333333334 L378,240 Z" fill="#2a78d6" data-tip="矩阵边长不是 16 的倍数时补零：有效 145.8G 变成带零 223.8G，×1.53"/><text x="340" y="197.83333333333334" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">0.82s</text><text x="340" y="258" text-anchor="middle" font-size="12" fill="#52514e">×1.53</text><text x="340" y="273" text-anchor="middle" font-size="12" fill="#52514e">padding</text><path d="M422,240 L422,63.99999999999997 A4,4 0 0 1 426,59.99999999999997 L494,59.99999999999997 A4,4 0 0 1 498,63.99999999999997 L498,240 Z" fill="#2a78d6" data-tip="阵列真正在算的时间只占 12%：权重反复装、激活反复装、5.4 万条转置指令把阵列饿着。63%÷12% = ×5.27"/><text x="460" y="51.99999999999997" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">4.32s</text><text x="460" y="258" text-anchor="middle" font-size="12" fill="#52514e">×5.27</text><text x="460" y="273" text-anchor="middle" font-size="12" fill="#52514e">搬运与停顿</text></svg>