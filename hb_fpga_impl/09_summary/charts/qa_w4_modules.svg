<svg viewBox="0 0 680 262" role="img" aria-label="六个模块各占多少权重字节，哪些降到 INT4（总 159.5 MB）" style="width:100%;height:auto;display:block"><line x1="175" y1="10" x2="175" y2="232" stroke="#e1e0d9" stroke-width="1"/><text x="175" y="248" text-anchor="middle" font-size="11" fill="#898781">0</text><line x1="250" y1="10" x2="250" y2="232" stroke="#e1e0d9" stroke-width="1"/><text x="250" y="248" text-anchor="middle" font-size="11" fill="#898781">25</text><line x1="325" y1="10" x2="325" y2="232" stroke="#e1e0d9" stroke-width="1"/><text x="325" y="248" text-anchor="middle" font-size="11" fill="#898781">50</text><line x1="400" y1="10" x2="400" y2="232" stroke="#e1e0d9" stroke-width="1"/><text x="400" y="248" text-anchor="middle" font-size="11" fill="#898781">75</text><line x1="475" y1="10" x2="475" y2="232" stroke="#e1e0d9" stroke-width="1"/><text x="475" y="248" text-anchor="middle" font-size="11" fill="#898781">100</text><line x1="175" y1="10" x2="175" y2="232" stroke="#c3c2b7" stroke-width="1"/><path d="M175,14 L425.70000000000005,14 A4,4 0 0 1 429.70000000000005,18 L429.70000000000005,28 A4,4 0 0 1 425.70000000000005,32 L175,32 Z" fill="#2a78d6" data-tip="占 53% 字节的模块恰恰最不敏感：per-tensor INT4 偏差 0.0187 rad，还低于 W8 基线 0.0259（同一噪声带，不是更准，是不可区分）。85M 参数的大块权重分布平整，小模型 W4 必须分组的普遍规律里它是例外"/><text x="165" y="27.5" text-anchor="end" font-size="12.5" fill="#52514e">text_encoder（BERT）</text><text x="437.70000000000005" y="27.5" font-size="12.5" font-weight="600" fill="#0b0b0b">84.9 · 降 INT4</text><path d="M175,50 L253.2,50 A4,4 0 0 1 257.2,54 L257.2,64 A4,4 0 0 1 253.2,68 L175,68 Z" fill="#2a78d6" data-tip="per-tensor 会掉到 0.049（真实样本 0.075+），必须组内 scale（g=128）。g=64 与 g=128 实测等效，组宽可按硬件方便选。注意：QoQ 式装载时解包回 INT8 的零 RTL 路线在这里不行，组 scale 折进 per-tensor 网格后真实样本最差 0.079"/><text x="165" y="63.5" text-anchor="end" font-size="12.5" fill="#52514e">vision_2d（Swin RGB）</text><text x="265.2" y="63.5" font-size="12.5" font-weight="600" fill="#0b0b0b">27.4 · 降 INT4 g128</text><path d="M175,86 L240.9,86 A4,4 0 0 1 244.9,90 L244.9,100 A4,4 0 0 1 240.9,104 L175,104 Z" fill="#2a78d6" data-tip="g=128 也要 0.0382，离红线太近，不动"/><text x="165" y="99.5" text-anchor="end" font-size="12.5" fill="#52514e">fusion</text><text x="252.9" y="99.5" font-size="12.5" font-weight="600" fill="#0b0b0b">23.3 · 保持 W8</text><path d="M175,122 L233.1,122 A4,4 0 0 1 237.1,126 L237.1,136 A4,4 0 0 1 233.1,140 L175,140 Z" fill="#2a78d6" data-tip="单独 g=128 是 0.0354 尚可，但激进档（42% 节省）合成 0.037–0.047、真实出现 0.056–0.065 坏例，超 0.04 红线。想拉它进来优先 GPTQ/HQQ，且标定集必须覆盖全部去噪 timestep"/><text x="165" y="135.5" text-anchor="end" font-size="12.5" fill="#52514e">action_head</text><text x="245.1" y="135.5" font-size="12.5" font-weight="600" fill="#0b0b0b">20.7 · 保持 W8</text><path d="M175,158 L178.15,158 A3.1500000000000004,3.1500000000000004 0 0 1 181.3,161.15 L181.3,172.85 A3.1500000000000004,3.1500000000000004 0 0 1 178.15,176 L175,176 Z" fill="#2a78d6" data-tip="per-tensor 0.0226，免费"/><text x="165" y="171.5" text-anchor="end" font-size="12.5" fill="#52514e">neck_convs</text><text x="189.3" y="171.5" font-size="12.5" font-weight="600" fill="#0b0b0b">2.1 · 降 INT4</text><path d="M175,194 L176.35,194 A1.35,1.35 0 0 1 177.7,195.35 L177.7,210.65 A1.35,1.35 0 0 1 176.35,212 L175,212 Z" fill="#2a78d6" data-tip="只占 0.6% 字节，真实样本 s2 会崩到 0.067——不值得冒险"/><text x="165" y="207.5" text-anchor="end" font-size="12.5" fill="#52514e">vision_3d</text><text x="185.7" y="207.5" font-size="12.5" font-weight="600" fill="#0b0b0b">0.9 · 保持 W8</text></svg>